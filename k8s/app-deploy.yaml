apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
      - name: inventory-app
        image: docker.io/nitin3cmy2k/inventory-app:latest
        imagePullPolicy: Always # Ensures the cluster drops old cached images for :latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: inventory-config # Injects DB_HOST, DB_NAME, DB_USER, and DB_PORT automatically
        env:
        - name: DB_PASSWORD # Injects your database password alongside the ConfigMap keys
          valueFrom:
            secretKeyRef:
              name: inventory-secret
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  ClusterIP: 
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30032
  selector:
    app: inventory-app

